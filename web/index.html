<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTNH Turbine Calculator</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        GTNH<br><span>Turbines</span>
        <select id="version-select" class="version-select"></select>
      </div>
      <ul class="nav-list">
        <li class="nav-item active" data-section="calculator" data-i18n="nav_calculator">⚡ Calculator</li>
        <li class="nav-item" data-section="ehe"        data-i18n="nav_ehe">🔥 EHE Planner</li>
        <li class="nav-item" data-section="steam-gen"  data-i18n="nav_steam_gen">💧 Steam Gen</li>
        <li class="nav-item" data-section="fuels"      data-i18n="nav_fuels">⛽ Fuels</li>
        <li class="nav-item" data-section="rotors"     data-i18n="nav_rotors">🔩 Rotors</li>
        <li class="nav-item" data-section="settings"   data-i18n="nav_settings">⚙ Settings</li>
      </ul>
      <div class="sidebar-footer">
        <a id="app-version" class="sidebar-footer-version" target="_blank" rel="noopener"></a>
        <a class="sidebar-footer-issues" href="https://github.com/Eldrinn-Elantey/GTNH-Large-Turbine-Calculator/issues" target="_blank" rel="noopener">🐛 Issues</a>
      </div>
    </nav>
    <main class="main-content">
      <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
      <div id="section-calculator" class="section"></div>
      <div id="section-ehe"        class="section hidden"></div>
      <div id="section-steam-gen"  class="section hidden"></div>
      <div id="section-fuels"      class="section hidden"></div>
      <div id="section-rotors"     class="section hidden"></div>
      <div id="section-settings"   class="section hidden"></div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
  <script data-goatcounter="https://eldrinn-elantey.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
